name: windows-build

on:
  push:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/validate_assets.py

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Build (tests, assets check, PyInstaller, frozen smoke test, zip)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python "python"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dev-preview
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
