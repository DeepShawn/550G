name: windows-build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "构建成功后创建 GitHub Release（标签取自 app/version.py）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/validate_assets.py

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Build (tests, assets check, PyInstaller, frozen smoke test, zip)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python "python"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dev-preview
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  # 手动运行并勾选 release，或推送 v* 标签时：用本次构建产物创建 GitHub Release。
  # 标签取自 app/version.py（推送的标签必须与之一致）；标签含 "-"（如 v0.3.0-dev-preview）时为预发布。
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [test-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-dev-preview
          path: dist-release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ver=$(sed -n 's/^APP_VERSION = "\([^"]*\)".*/\1/p' app/version.py)
          stage=$(sed -n 's/^APP_STAGE = "\([^"]*\)".*/\1/p' app/version.py)
          TAG="v${ver}${stage:+-$stage}"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$TAG" ]; then echo "tag $REF_NAME != app version $TAG"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG already exists"; exit 1; fi
          notes="docs/release-notes/${TAG}.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; esac
          ls -la dist-release
          gh release create "$TAG" dist-release/*.zip dist-release/SHA256SUMS.txt \
            --title "550G × 前辈GPT 桌宠 ${TAG}" --notes-file "$notes" --target "$GITHUB_SHA" $flags
