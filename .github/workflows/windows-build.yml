name: windows-build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python tools/validate_assets.py

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Build (tests, assets check, PyInstaller, frozen smoke test, zip)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python "python"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dev-preview
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  # 推送 v* 标签时：校验标签与 app/version.py 一致，然后用构建产物创建 GitHub Release。
  # 标签含 "-"（如 v0.3.0-dev-preview）时发布为预发布版本。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-dev-preview
          path: dist-release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' app/version.py)
          stage=$(sed -n 's/^APP_STAGE = "\(.*\)"/\1/p' app/version.py)
          expected="v${ver}${stage:+-$stage}"
          if [ "$TAG" != "$expected" ]; then echo "tag $TAG != app version $expected"; exit 1; fi
          notes="docs/release-notes/${TAG}.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          flags=""
          case "$TAG" in *-*) flags="--prerelease";; esac
          ls -la dist-release
          gh release create "$TAG" dist-release/*.zip dist-release/SHA256SUMS.txt \
            --title "550G × 前辈GPT 桌宠 ${TAG}" --notes-file "$notes" --verify-tag $flags
